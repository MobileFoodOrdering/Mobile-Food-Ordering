<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>

<style>
body{font-family:Arial;background:#f5f5f5;text-align:center;padding:50px}
.box{background:white;padding:25px;border-radius:10px;max-width:350px;margin:auto}
input,button{width:90%;padding:12px;margin:8px;box-sizing:border-box}
button{background:#ff6b00;color:white;border:0;border-radius:6px}
</style>
</head>

<body>

<div class="box">

<h1>🔐 Admin Login</h1>

<input id="user" Admin="Username">
<input id="pass" type="password" admin123="Password">

<button id="loginBtn">Login</button>

<p id="msg"></p>

</div>

<script>
// @ts-nocheck

document.getElementById("loginBtn").onclick=function(){

let user=document.getElementById("user").value.trim();
let pass=document.getElementById("pass").value;

if(user==="admin"&&pass==="admin123"){

sessionStorage.setItem("adminLoggedIn","true");
location.href="admin.html";

}else{

document.getElementById("msg").textContent=
"Wrong username or password.";

}

};
</script>

</body>
</html>
